name: Verify harness
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: |
          python -m pip install -c requirements.lock '.[dev]'
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Static checks
        run: |
          ruff check aegis tests
          ruff format --check aegis tests
          npm run check:js
      - name: Boundary and integration tests
        run: python -m pytest -q
      - name: Trajectory evaluations
        run: python -m aegis eval --output artifacts/eval-report.json
      - name: Browser flow
        run: npm run test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verification-evidence
          path: |
            artifacts/
            dashboard.png
          retention-days: 14

[project]
name = "aegis-agent-harness"
version = "1.0.0"
description = "An inspectable multi-agent harness with policy enforcement, a model gateway, caching, OpenTelemetry, and trajectory evaluations."
requires-python = ">=3.12"
dependencies = [
  "langgraph>=1.2.14,<2", "langgraph-checkpoint-sqlite>=3,<4", "langsmith>=0.14.4,<1",
  "fastapi>=0.142,<1", "uvicorn>=0.54,<1", "httpx>=0.28,<1",
  "pydantic>=2.13,<3", "opentelemetry-sdk>=1.45,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=1,<2", "ruff>=0.16,<1"]

[project.scripts]
aegis = "aegis.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aegis*"]

[tool.setuptools.package-data]
aegis = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
